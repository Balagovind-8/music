
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Music Player</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen font-sans text-gray-100 p-4">

  <div id="player-card" class="w-full max-w-lg rounded-2xl p-6 md:p-8 shadow-2xl transform hover:scale-[1.02] transition-transform duration-300">

    <!-- Header -->
    <header class="text-center space-y-2">
      <p class="text-xs font-medium uppercase tracking-widest text-purple-400">Now Playing</p>
      <h1 id="track-name" class="text-2xl md:text-3xl font-extrabold truncate">Loading...</h1>
      <p id="track-artist" class="text-sm text-gray-300">Loading...</p>
    </header>

    <!-- Album Art -->
    <div class="relative mt-4 w-full aspect-square rounded-xl overflow-hidden shadow-xl bg-gradient-to-br from-purple-800 to-purple-600 flex items-center justify-center album-art">
      <i data-lucide="music" class="w-16 h-16 text-white/70 z-10"></i>
      <div class="absolute inset-0 bg-black/30"></div>
    </div>

    <!-- Progress Bar -->
    <div class="mt-6 space-y-2">
      <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full h-1 rounded-lg appearance-none bg-gray-700 cursor-pointer" disabled>
      <div class="flex justify-between text-xs font-mono text-gray-400">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="flex items-center justify-center space-x-6 py-4">
      <button id="prev-btn" class="p-3 text-gray-300 hover:text-purple-400 transition" aria-label="Previous Track">
        <i data-lucide="skip-back" class="w-6 h-6"></i>
      </button>
      <button id="play-pause-btn" class="p-4 bg-gradient-to-br from-purple-600 to-purple-400 rounded-full shadow-lg hover:scale-105 transition-transform" aria-label="Play/Pause">
        <i id="play-pause-icon" data-lucide="play" class="w-8 h-8 text-white"></i>
      </button>
      <button id="next-btn" class="p-3 text-gray-300 hover:text-purple-400 transition" aria-label="Next Track">
        <i data-lucide="skip-forward" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Volume Control -->
    <div class="flex items-center space-x-3 pt-2">
      <i data-lucide="volume-low" class="w-5 h-5 text-gray-400"></i>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.75" class="w-full h-1 rounded-lg appearance-none bg-gray-700 cursor-pointer">
      <i data-lucide="volume-high" class="w-5 h-5 text-gray-400"></i>
    </div>

  </div>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
